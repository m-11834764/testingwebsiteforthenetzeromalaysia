<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Net-zero Malaysia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <a href="index.html" class="logo">Net-zero Malaysia</a>
    <nav>
      <button id="menu-button" aria-expanded="false" aria-controls="menu-list">Menu</button>
      <ul id="menu-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="aboutus.html">About Us</a></li>
        <li><a href="solutions.html">Solutions</a></li>
        <li><a href="contactus.html" class="current">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <section class="page-title">
      <h1>Contact Us</h1>
      <p>Have a question or some feedback? Send us a message using the form below.</p>
    </section>

    <section class="section">
      <div class="container">

        <form method="POST">

          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>

          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="e.g. 012-345 6789">

          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required></textarea>

          <button type="submit" class="button">Submit</button>

        </form>

      </div>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 Net-zero Malaysia. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
